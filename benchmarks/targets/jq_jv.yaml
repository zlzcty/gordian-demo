name: jq_jv
sources:
- benchmarks/jq/src/jv.c
- benchmarks/jq/src/jv_parse.c
- benchmarks/jq/src/jv_dtoa.c
- benchmarks/jq/src/jv_dtoa_tsd.c
- benchmarks/jq/src/jv_alloc.c
- benchmarks/jq/src/jv_unicode.c
- benchmarks/jq/src/jv_aux.c
- benchmarks/jq/src/jv_print.c
- benchmarks/jq/src/util.c
- benchmarks/jq/src/execute.c
- benchmarks/jq/src/jv_file.c
- benchmarks/jq/src/locfile.c
- benchmarks/jq/src/linker.c
- benchmarks/jq/src/parser.c
- benchmarks/jq/src/lexer.c
- benchmarks/jq/src/compile.c
- benchmarks/jq/src/bytecode.c
- benchmarks/jq/src/builtin.c
family: jq
float: false
